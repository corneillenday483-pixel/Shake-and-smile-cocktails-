<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shake & Smile | Prestige Mixologie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;600;900&display=swap');
        :root { --gold: #D4AF37; }

        body { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1551024709-8f23befc6f87?q=80&w=2000&auto=format&fit=crop'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Inter', sans-serif; transition: 0.3s;
        }

        /* Effet flou global sur le contenu arrière */
        body.modal-open #main-content { filter: blur(10px); pointer-events: none; }

        .gold-text { background: linear-gradient(to right, #D4AF37, #FBF5B7, #D4AF37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Boutons avec dégradé flou */
        .glass-item { 
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 22px; transition: all 0.3s ease;
        }
        .glass-item:hover { border-color: var(--gold); transform: translateY(-3px); }

        /* Fenêtres Pop-up Dark Frost */
        .modal { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.5); z-index: 9999; 
            align-items: center; justify-content: center; padding: 20px; 
        }
        .modal-content { 
            background: rgba(10, 10, 10, 0.85); /* Plus sombre */
            backdrop-filter: blur(30px); border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 35px; width: 100%; max-width: 400px; padding: 25px; 
            max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .btn-gold { background: linear-gradient(135deg, #D4AF37, #B8860B); color: #000; font-weight: 900; border-radius: 18px; }

        input, select, textarea { 
            background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; 
            color: white !important; padding: 14px; border-radius: 15px; width: 100%; margin-top: 10px;
        }

        .pack-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .pack-img { width: 100%; height: 110px; object-fit: cover; border-radius: 15px; border: 1px solid rgba(212,175,55,0.2); }
    </style>
</head>
<body class="max-w-md mx-auto px-6 py-10">

    <div id="main-content">
        <header class="text-center mb-10 animate__animated animate__fadeIn">
            <img src="1767271665944 (3).png" class="w-32 h-32 mx-auto mb-4 object-contain filter drop-shadow(0 0 10px rgba(212,175,55,0.4))">
            <h1 class="text-4xl font-black gold-text italic" style="font-family: 'Playfair Display';">Shake & Smile</h1>
            <p class="text-[9px] tracking-[0.4em] uppercase text-gray-400 mt-2 font-bold">Artisan Mixologue</p>
        </header>

        <div class="space-y-4 mb-10">
            <button onclick="toggleModal('devisModal', true)" class="w-full btn-gold py-5 text-sm uppercase tracking-widest shadow-xl">
                <i class="fa-solid fa-file-signature mr-2"></i> Faire un Devis
            </button>
            <div class="grid grid-cols-2 gap-4">
                <div onclick="toggleModal('discoveryModal', true)" class="glass-item py-4 text-center text-[10px] font-black uppercase tracking-widest">✨ Galerie</div>
                <div onclick="toggleModal('reviewsModal', true)" class="glass-item py-4 text-center text-[10px] font-black uppercase tracking-widest">💬 Avis</div>
            </div>
        </div>

        <div class="space-y-4 mb-12">
            <h2 class="text-center text-[10px] font-black text-gray-500 uppercase tracking-widest mb-6 italic">— Nos Formules —</h2>
            <div onclick="openPack('Platinum Prestige', 'Luxe ultime : Spectacle de fumée, cocktails Arc-en-ciel et verrerie cristal.', ['https://i.ibb.co/VWVv31V3/1767794354722.jpg', 'https://i.ibb.co/93nhSVqc/1767794466129.jpg'])" class="glass-item p-6 flex justify-between items-center">
                <span class="text-lg font-black gold-text italic">Platinum Prestige</span>
                <i class="fa-solid fa-crown text-gold"></i>
            </div>
            <div onclick="openPack('Gold Experience', 'Équilibre parfait : Créations artistiques et classiques revisités.', ['https://i.ibb.co/ynD102Vf/1767794560467.jpg', 'https://i.ibb.co/kVmw2r0j/0619fc3a6e6d3404cb4434cc1019b112.jpg'])" class="glass-item p-6 flex justify-between items-center">
                <span class="text-lg font-black text-white italic">Gold Experience</span>
                <i class="fa-solid fa-star opacity-40"></i>
            </div>
            <div onclick="openPack('Fresh Smile', 'Naturel et Frais : Mocktails premium et cocktails aux fruits de saison.', ['https://i.ibb.co/84RJ9w2Z/55b62810858f8abfb593fdaf3fa4aedd.jpg', 'https://i.ibb.co/Kjk0W2zG/e08dbd05085f4b972d0981d800bdb1af-1.jpg'])" class="glass-item p-6 flex justify-between items-center">
                <span class="text-lg font-black text-blue-300 italic">Fresh Smile</span>
                <i class="fa-solid fa-leaf text-blue-300 opacity-50"></i>
            </div>
        </div>

        <div class="glass-item p-6 text-center mb-10">
            <h2 class="text-[9px] font-black text-gray-500 uppercase mb-5 tracking-widest">Paiement Sécurisé</h2>
            <div class="flex justify-around items-center">
                <div onclick="alert('Orange : 084 061 284 9')" class="cursor-pointer">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Orange_logo.svg" class="w-10 h-10 mx-auto mb-1">
                    <p class="text-[9px] font-bold">Orange</p>
                </div>
                <div onclick="alert('Airtel : 097 835 512 1')" class="cursor-pointer">
                    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center mx-auto mb-1 text-[14px] font-black">A</div>
                    <p class="text-[9px] font-bold">Airtel</p>
                </div>
            </div>
        </div>

        <div class="flex justify-center gap-10 mb-10 text-2xl text-gray-400">
            <a href="https://www.instagram.com/shake.andsmile" target="_blank" class="hover:text-gold"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@shakeandsmilecocktail" target="_blank" class="hover:text-gold"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://wa.me/243978355121" target="_blank" class="text-green-500"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </div>

    <div id="devisModal" class="modal">
        <div class="modal-content animate__animated animate__zoomIn">
            <h2 class="gold-text text-xl font-black italic mb-4">DEVIS RAPIDE</h2>
            <input type="text" id="f-nom" placeholder="Votre Nom">
            <input type="text" id="f-event" placeholder="Type d'événement">
            <input type="text" id="f-date" placeholder="Date">
            <input type="text" id="f-lieu" placeholder="Lieu">
            <input type="number" id="f-invites" placeholder="Nb d'invités">
            <select id="f-pack">
                <option value="Platinum Prestige">Platinum Prestige</option>
                <option value="Gold Experience">Gold Experience</option>
                <option value="Fresh Smile">Fresh Smile</option>
            </select>
            <button onclick="sendDevis()" class="w-full btn-gold py-4 mt-6 uppercase text-[10px] font-black">Envoyer WhatsApp</button>
            <button onclick="toggleModal('devisModal', false)" class="w-full mt-3 text-gray-500 text-[10px] uppercase">Fermer</button>
        </div>
    </div>

    <div id="packModal" class="modal">
        <div class="modal-content animate__animated animate__zoomIn">
            <div id="p-gallery" class="pack-gallery"></div>
            <h2 id="p-title" class="gold-text text-xl font-black italic mb-2"></h2>
            <p id="p-desc" class="text-xs text-gray-400 leading-relaxed mb-6"></p>
            <button onclick="toggleModal('packModal', false)" class="w-full btn-gold py-4 uppercase text-[10px] font-black">Fermer</button>
        </div>
    </div>

    <div id="reviewsModal" class="modal">
        <div class="modal-content animate__animated animate__zoomIn">
            <h2 class="gold-text text-xl font-black italic mb-6">VOS AVIS</h2>
            <div id="reviews-list" class="space-y-4 mb-6">
                <div class="border-l border-gold/30 pl-3"><p class="text-xs italic">"Incontournable !"</p><p class="text-[8px] text-gold">— Client</p></div>
            </div>
            <div class="border-t border-white/10 pt-4">
                <input type="text" id="r-name" placeholder="Nom">
                <textarea id="r-text" rows="2" placeholder="Avis..."></textarea>
                <button onclick="addReview()" class="w-full btn-gold py-3 mt-3 text-[10px] uppercase">Publier</button>
            </div>
            <button onclick="toggleModal('reviewsModal', false)" class="w-full mt-4 text-gray-500 text-[10px] uppercase">Fermer</button>
        </div>
    </div>

    <div id="discoveryModal" class="modal">
        <div class="modal-content animate__animated animate__zoomIn text-center">
            <h2 class="gold-text text-xl font-black italic mb-6">GALERIE</h2>
            <div class="space-y-3">
                <a href="https://www.tiktok.com/@shakeandsmilecocktail" class="block w-full py-4 border border-white/10 rounded-xl text-[10px] font-black uppercase">TikTok</a>
                <a href="https://www.instagram.com/shake.andsmile" class="block w-full py-4 border border-white/10 rounded-xl text-[10px] font-black uppercase">Instagram</a>
            </div>
            <button onclick="toggleModal('discoveryModal', false)" class="mt-8 text-gray-500 text-[10px] uppercase">Fermer</button>
        </div>
    </div>

    <script>
        function toggleModal(id, show) { 
            const m = document.getElementById(id);
            if(show) { m.style.display = 'flex'; document.body.classList.add('modal-open'); }
            else { m.style.display = 'none'; document.body.classList.remove('modal-open'); }
        }
        
        function openPack(title, desc, imgs) {
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-desc').innerText = desc;
            const gal = document.getElementById('p-gallery');
            gal.innerHTML = '';
            imgs.forEach(s => { gal.innerHTML += `<img src="${s}" class="pack-img">`; });
            toggleModal('packModal', true);
        }

        function addReview() {
            const n = document.getElementById('r-name').value;
            const t = document.getElementById('r-text').value;
            if(!n || !t) return;
            document.getElementById('reviews-list').innerHTML += `<div class="border-l border-gold/30 pl-3"><p class="text-xs italic">"${t}"</p><p class="text-[8px] text-gold">— ${n}</p></div>`;
            document.getElementById('r-name').value = ''; document.getElementById('r-text').value = '';
        }

        function sendDevis() {
            const n = document.getElementById('f-nom').value;
            const e = document.getElementById('f-event').value;
            const d = document.getElementById('f-date').value;
            const l = document.getElementById('f-lieu').value;
            const i = document.getElementById('f-invites').value;
            const p = document.getElementById('f-pack').value;
            if(!n || !e) return;
            const msg = `*DEVIS SHAKE %26 SMILE*%0A👤 Client: ${n}%0A🍸 Event: ${e}%0A📅 Date: ${d}%0A📍 Lieu: ${l}%0A👥 Convives: ${i}%0A✨ Pack: ${p}`;
            window.open(`https://wa.me/243978355121?text=${msg}`, '_blank');
        }

        window.onclick = function(e) { if(e.target.className === 'modal') toggleModal(e.target.id, false); }
    </script>
</body>
</html>
