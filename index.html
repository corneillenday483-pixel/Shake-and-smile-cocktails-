<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shake & Smile | Prestige Mixologie</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;600;900&display=swap');
:root { --gold:#D4AF37; }

body{
font-family:'Inter',sans-serif;
color:#fff;
background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.65)),
url('1767271665944 (3).png');
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.gold-text{
background:linear-gradient(to right,#D4AF37,#FBF5B7,#D4AF37);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.glow-item{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:20px;
border:1px solid rgba(212,175,55,0.25);
transition:.4s;
}
.glow-item:hover{
box-shadow:0 0 20px rgba(212,175,55,.4);
transform:translateY(-3px);
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:9999;
align-items:center;
justify-content:center;
}

.modal-content{
background:#0c0c0c;
border:1px solid var(--gold);
border-radius:25px;
width:100%;
max-width:420px;
padding:25px;
max-height:90vh;
overflow-y:auto;
}

.btn-gold{
background:linear-gradient(135deg,#D4AF37,#B8860B);
color:#000;
font-weight:900;
border-radius:15px;
}

input,select{
background:rgba(255,255,255,.08);
border:1px solid rgba(212,175,55,.3);
color:#fff;
padding:12px;
border-radius:12px;
width:100%;
margin-top:10px;
}

.gallery-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.gallery-img{
width:100%;
height:110px;
object-fit:cover;
border-radius:12px;
border:1px solid rgba(212,175,55,.2);
}
</style>
</head>

<body class="max-w-md mx-auto px-6 py-10">

<header class="text-center mb-10">
<img src="1767271665944 (3).png" class="w-28 mx-auto mb-4">
<h1 class="text-4xl font-black gold-text italic" style="font-family:'Playfair Display'">Shake & Smile</h1>
<p class="text-[10px] tracking-[0.3em] uppercase text-gray-300 mt-2">Mixologie de Prestige</p>
</header>

<div class="space-y-4 mb-10">
<button onclick="toggleModal('devisModal',true)" class="w-full btn-gold py-5 glow-item">
<i class="fa-solid fa-file-signature mr-2"></i> Obtenir mon devis
</button>

<div class="grid grid-cols-2 gap-4">
<div onclick="toggleModal('discoveryModal',true)" class="glow-item py-4 text-center cursor-pointer">✨ Galerie</div>
<div onclick="toggleModal('reviewsModal',true)" class="glow-item py-4 text-center cursor-pointer">💬 Livre d'Or</div>
</div>
</div>

<!-- MODALS -->

<div id="discoveryModal" class="modal">
<div class="modal-content text-center">
<h2 class="gold-text text-xl font-black mb-6 italic">Galerie</h2>
<div class="gallery-grid">
<img src="https://i.ibb.co/VWVv31V3/1767794354722.jpg" class="gallery-img">
<img src="https://i.ibb.co/93nhSVqc/1767794466129.jpg" class="gallery-img">
</div>
<button onclick="toggleModal('discoveryModal',false)" class="btn-gold w-full mt-6 py-3">Retour</button>
</div>
</div>

<div id="reviewsModal" class="modal">
<div class="modal-content">
<h2 class="gold-text text-xl font-black mb-6 italic">Livre d'Or</h2>
<p class="text-sm italic mb-2">"Show incroyable, invités bluffés"</p>
<p class="text-xs text-gold">— Jean M.</p>
<button onclick="toggleModal('reviewsModal',false)" class="btn-gold w-full mt-6 py-3">Retour</button>
</div>
</div>

<div id="devisModal" class="modal">
<div class="modal-content">
<input id="f-nom" placeholder="Nom complet">
<input id="f-event" placeholder="Événement">
<input id="f-date" placeholder="Date">
<input id="f-lieu" placeholder="Lieu">
<input id="f-invites" placeholder="Invités">
<select id="f-pack">
<option>Platinum Prestige</option>
<option>Gold Experience</option>
<option>Fresh Smile</option>
</select>
<button onclick="sendDevisFull()" class="btn-gold w-full mt-6 py-4">Envoyer</button>
</div>
</div>

<script>
function toggleModal(id,show){
document.getElementById(id).style.display=show?'flex':'none';
}

window.onclick=e=>{
if(e.target.classList.contains('modal')){
e.target.style.display='none';
}
}

function sendDevisFull(){
const nom=fNom=fNom=document.getElementById('f-nom').value;
const event=document.getElementById('f-event').value;
const date=document.getElementById('f-date').value;
const lieu=document.getElementById('f-lieu').value||'Non précisé';
const invites=document.getElementById('f-invites').value||'Non précisé';
const pack=document.getElementById('f-pack').value;

let message=`DEMANDE DE DEVIS SHAKE & SMILE
Client: ${nom}
Événement: ${event}
Date: ${date}
Lieu: ${lieu}
Invités: ${invites}
Formule: ${pack}`;

window.open(`https://wa.me/243978355121?text=${encodeURIComponent(message)}`,'_blank');
}
</script>

</body>
    </html>
