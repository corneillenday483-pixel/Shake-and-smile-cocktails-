<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shake & Smile | Prestige Mixologie</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;600;900&display=swap');

:root { --gold: #D4AF37; }

/* BACKGROUND PREMIUM LOUNGE */
body { 
    background:
        radial-gradient(circle at top, rgba(212,175,55,0.15), transparent 60%),
        linear-gradient(rgba(10,15,20,0.65), rgba(5,10,15,0.75)),
        url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?q=80&w=2070&auto=format&fit=crop'); 
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    font-family: 'Inter', sans-serif;
}

.gold-text {
    background: linear-gradient(to right, #D4AF37, #FBF5B7, #D4AF37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.glow-item {
    transition: all 0.4s ease;
    border: 1px solid rgba(212, 175, 55, 0.2);
    background: rgba(20, 40, 35, 0.45);
    backdrop-filter: blur(10px);
    border-radius: 20px;
}
.glow-item:hover {
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(212,175,55,0.4);
    transform: translateY(-3px);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background: #0a0f12;
    border: 1px solid var(--gold);
    border-radius: 30px;
    width: 100%;
    max-width: 400px;
    padding: 25px;
    max-height: 90vh;
    overflow-y: auto;
    animation: fadeUp 0.4s ease forwards;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.btn-gold {
    background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
    color: #000;
    font-weight: 900;
    border-radius: 15px;
}

input, select {
    background: rgba(255,255,255,0.05)!important;
    border: 1px solid rgba(212,175,55,0.3)!important;
    color: white!important;
    padding: 12px;
    border-radius: 12px;
    width: 100%;
    margin-top: 10px;
    font-size: 14px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.gallery-img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.2);
}
</style>
</head>

<body class="max-w-md mx-auto px-6 py-10">

<header class="text-center mb-10 animate__animated animate__fadeIn">
    <img src="1767271665944 (3).png" class="w-32 h-32 mx-auto mb-4 object-contain filter drop-shadow">
    <h1 class="text-4xl font-black gold-text italic" style="font-family: 'Playfair Display';">Shake & Smile</h1>
    <p class="text-[10px] tracking-[0.3em] uppercase text-gray-400 mt-2 font-bold italic">Mixologie de Prestige</p>
</header>

<div class="space-y-4 mb-10">
    <button onclick="toggleModal('devisModal', true)" class="w-full btn-gold py-5 text-sm uppercase tracking-widest glow-item">
        <i class="fa-solid fa-file-signature mr-2"></i> Obtenir mon Devis
    </button>

    <div class="grid grid-cols-2 gap-4">
        <div onclick="toggleModal('discoveryModal', true)" class="glow-item py-4 text-center text-[10px] font-black uppercase tracking-widest cursor-pointer">✨ Galerie</div>
        <div onclick="toggleModal('reviewsModal', true)" class="glow-item py-4 text-center text-[10px] font-black uppercase tracking-widest cursor-pointer">💬 Livre d'Or</div>
    </div>
</div>

<!-- MODALS (Galerie, Avis, Devis, Paiement, Packs) IDENTIQUES À TON CODE -->

<script>
function toggleModal(id, show) {
    document.getElementById(id).style.display = show ? 'flex' : 'none';
}

/* FIX CLIC EXTÉRIEUR */
window.onclick = function(e) {
    if (e.target.classList && e.target.classList.contains('modal')) {
        e.target.style.display = 'none';
    }
};

/* WHATSAPP DEVIS COMPLET */
function sendDevisFull() {
    const nom = document.getElementById('f-nom').value;
    const event = document.getElementById('f-event').value;
    const date = document.getElementById('f-date').value;
    const lieu = document.getElementById('f-lieu').value;
    const nbr = document.getElementById('f-invites').value;
    const pack = document.getElementById('f-pack').value;

    if(!nom || !event || !date) {
        alert("Veuillez remplir au minimum le nom, l'événement et la date.");
        return;
    }

    const message = `
DEMANDE DE DEVIS SHAKE & SMILE
----------------------------
👤 Client : ${nom}
🍸 Événement : ${event}
📅 Date : ${date}
📍 Lieu : ${lieu}
👥 Invités : ${nbr}
✨ Formule : ${pack}
----------------------------
`;

    window.open(
        `https://wa.me/243978355121?text=${encodeURIComponent(message)}`,
        '_blank'
    );
}
</script>

</body>
    </html>
