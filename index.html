<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shake & Smile | Prestige Mixologie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;600;900&display=swap');
        :root { --gold: #D4AF37; --dark-bg: #050505; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        .smoke-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; overflow: hidden; }
        .smoke-layer { position: absolute; width: 200%; height: 200%; background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png'); opacity: 0.2; animation: smokeFloat 25s linear infinite; }
        @keyframes smokeFloat { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(-5%, -10%) rotate(3deg); } }

        .logo-clean { mix-blend-mode: screen; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
        .gold-text { background: linear-gradient(to right, #D4AF37, #FBF5B7, #D4AF37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .glow-item { position: relative; transition: all 0.4s ease; border: 1px solid rgba(212, 175, 55, 0.15); background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border-radius: 25px; overflow: hidden; cursor: pointer; }
        .glow-item:hover { border-color: var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 10px rgba(212, 175, 55, 0.2); transform: translateY(-5px); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--gold); border-radius: 35px; width: 100%; max-width: 400px; padding: 25px; box-shadow: 0 0 50px rgba(212, 175, 55, 0.3); }

        .btn-gold { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); color: #000; font-weight: 900; border-radius: 18px; }
        input, select, textarea { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(212, 175, 55, 0.3) !important; color: white !important; padding: 12px !important; border-radius: 12px !important; width: 100%; margin-top: 8px; }

        .pack-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .pack-img { width: 100%; height: 120px; object-cover rounded-2xl border border-white/10; }
    </style>
</head>
<body class="max-w-md mx-auto px-6 py-10" onload="loadReviews()">

    <div class="smoke-container"><div class="smoke-layer"></div></div>

    <header class="text-center mb-8 animate__animated animate__fadeIn">
        <img src="1767271665944 (3).png" class="w-40 h-40 logo-clean mx-auto mb-2 object-contain">
        <h1 class="text-4xl font-black gold-text italic tracking-tighter" style="font-family: 'Playfair Display';">Shake & Smile</h1>
        <p class="text-[9px] tracking-[0.4em] uppercase text-gray-400 mt-2 font-bold italic">L'art de la mixologie mobile</p>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <a href="https://www.instagram.com/shake.andsmile" target="_blank" class="glow-item py-4 flex items-center justify-center gap-2">
            <i class="fa-brands fa-instagram text-pink-500 text-lg"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">Instagram</span>
        </a>
        <a href="https://tiktok.com/@shakeandsmilecocktail" target="_blank" class="glow-item py-4 flex items-center justify-center gap-2">
            <i class="fa-brands fa-tiktok text-white text-lg"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">TikTok</span>
        </a>
    </div>

    <div class="space-y-4 mb-12">
        <button onclick="toggleModal('devisModal', true)" class="w-full btn-gold py-5 text-sm uppercase tracking-widest glow-item">
            <i class="fa-solid fa-file-signature mr-2"></i> Obtenir mon Devis
        </button>
        <div class="grid grid-cols-2 gap-4">
            <div onclick="toggleModal('discoveryModal', true)" class="glow-item py-4 text-center text-[10px] font-black uppercase tracking-widest">✨ Galerie</div>
            <div onclick="toggleModal('reviewsModal', true)" class="glow-item py-4 text-center text-[10px] font-black uppercase tracking-widest">💬 Livre d'Or</div>
        </div>
    </div>

    <div class="space-y-4 mb-16">
        <h2 class="text-center text-[10px] font-black text-gray-500 uppercase tracking-widest mb-6">Nos Prestations</h2>
        
        <div onclick="openPack('Platinum Prestige', 'Show magistral sous cloche de fumée, Cocktails Arc-en-ciel et créations sur-mesure.', ['https://i.ibb.co/VWVv31V3/1767794354722.jpg', 'https://i.ibb.co/93nhSVqc/1767794466129.jpg'])" class="glow-item p-6 flex justify-between items-center">
            <span class="text-lg font-black gold-text italic">🥇 Platinum Prestige</span>
            <i class="fa-solid fa-chevron-right text-gold opacity-50"></i>
        </div>

        <div onclick="openPack('Gold Experience', 'Élégance et équilibre : Une sélection de cocktails classiques et Arc-en-ciel pour une soirée chic.', ['https://i.ibb.co/ynD102Vf/1767794560467.jpg', 'https://i.ibb.co/kVmw2r0j/0619fc3a6e6d3404cb4434cc1019b112.jpg'])" class="glow-item p-6 flex justify-between items-center">
            <span class="text-lg font-black text-white italic">🥈 Gold Experience</span>
            <i class="fa-solid fa-chevron-right text-white opacity-30"></i>
        </div>

        <div onclick="openPack('Fresh Smile', 'Fraîcheur garantie : Cocktails classiques et versions Mocktails (sans alcool) aux fruits de saison.', ['https://i.ibb.co/84RJ9w2Z/55b62810858f8abfb593fdaf3fa4aedd.jpg', 'https://i.ibb.co/Kjk0W2zG/e08dbd05085f4b972d0981d800bdb1af-1.jpg'])" class="glow-item p-6 flex justify-between items-center">
            <span class="text-lg font-black text-blue-400 italic">🥉 Fresh Smile</span>
            <i class="fa-solid fa-chevron-right text-blue-400 opacity-50"></i>
        </div>
    </div>

    <div class="glow-item p-10 text-center mb-12">
        <h2 class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-8 italic">Paiement Sécurisé</h2>
        <div class="flex justify-around items-center">
            <div onclick="openPay('Orange Money', '084 061 284 9', 'https://onelink.to/xhrz5g')" class="cursor-pointer"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Orange_logo.svg" class="w-12 h-12 rounded-xl mb-2"><p class="text-[9px] font-bold text-orange-500">ORANGE</p></div>
            <div onclick="openPay('Airtel Money', '097 835 512 1', 'https://bit.ly/appsairtel')" class="cursor-pointer"><div class="w-12 h-12 bg-[#e11d48] rounded-full flex items-center justify-center mb-2 font-black italic">A</div><p class="text-[9px] font-bold text-red-500 uppercase">AIRTEL</p></div>
        </div>
    </div>

    <a href="https://wa.me/243978355121" class="glow-item p-5 flex items-center justify-center gap-3 mb-20 border-green-500/20">
        <i class="fa-brands fa-whatsapp text-green-500 text-2xl"></i>
        <span class="text-[11px] font-black uppercase tracking-widest">Discuter avec Shake & Smile</span>
    </a>

    <div id="packModal" class="modal">
        <div class="modal-content animate__animated animate__zoomIn">
            <div id="p-gallery" class="pack-gallery"></div>
            <h2 id="p-title" class="gold-text text-xl font-black italic mb-4"></h2>
            <p id="p-desc" class="text-xs text-gray-400 leading-relaxed mb-8"></p>
            <button onclick="toggleModal('packModal', false)" class="w-full btn-gold py-4 uppercase text-[10px] font-black">Fermer</button>
        </div>
    </div>

    <div id="devisModal" class="modal"><div class="modal-content"><h2 class="gold-text text-xl font-black italic mb-6 uppercase">Votre Devis</h2><div class="space-y-1"><input type="text" id="f-nom" placeholder="Nom complet"><input type="text" id="f-event" placeholder="Evénement (Mariage, Fête...)"><input type="text" id="f-date" placeholder="Date et Heure"><input type="text" id="f-addr" placeholder="Lieu"><input type="number" id="f-qty" placeholder="Invités"><select id="f-pack"><option value="Platinum Prestige">Platinum Prestige</option><option value="Gold Experience">Gold Experience</option><option value="Fresh Smile">Fresh Smile</option></select><button onclick="sendDevis()" class="w-full btn-gold py-5 mt-4 uppercase text-[11px] font-black">Envoyer ma demande</button></div></div></div>

    <script>
        function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
        
        function openPack(title, desc, imgs) {
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-desc').innerText = desc;
            const gallery = document.getElementById('p-gallery');
            gallery.innerHTML = ''; 
            imgs.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.className = "pack-img w-full object-cover rounded-xl border border-white/10";
                gallery.appendChild(img);
            });
            toggleModal('packModal', true);
        }

        function sendDevis() {
            const nom = document.getElementById('f-nom').value;
            const ev = document.getElementById('f-event').value;
            const dt = document.getElementById('f-date').value;
            const ad = document.getElementById('f-addr').value;
            const qt = document.getElementById('f-qty').value;
            const pk = document.getElementById('f-pack').value;
            if(!nom || !ev) { alert("Nom et événement requis."); return; }
            const text = `*DEMANDE DE DEVIS SHAKE %26 SMILE*%0A----------------------------%0A*Client :* ${nom}%0A*Event :* ${ev}%0A*Date :* ${dt}%0A*Lieu :* ${ad}%0A*Invités :* ${qt}%0A*Pack :* ${pk}%0A----------------------------`;
            window.open(`https://wa.me/243978355121?text=${text}`, '_blank');
        }

        function openPay(name, num, link) {
            document.getElementById('pay-title').innerText = name;
            document.getElementById('pay-num').innerText = num;
            document.getElementById('pay-link').href = link;
            toggleModal('payModal', true);
        }
        function loadReviews() { /* Logic as before */ }
        window.onclick = function(e) { if(e.target.className === 'modal') e.target.style.display = 'none'; }
    </script>
</body>
</html>
