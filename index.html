<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shake & Smile | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { 
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%); 
            color: #e5e5e5; 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .gold-text { color: #D4AF37; }
        .app-card { 
            background: rgba(26, 26, 26, 0.8); 
            backdrop-filter: blur(10px);
            border-radius: 24px; 
            border: 1px solid rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }
        .btn-gold { 
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); 
            color: #000; 
            font-weight: 800; 
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .pulse-gold { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        .hidden { display: none; }
        .logo-box { border: 2px solid #D4AF37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body class="max-w-md mx-auto px-6 py-10">

    <header class="text-center mb-10 animate__animated animate__fadeInDown">
        <div class="relative inline-block">
            <img src="1767271665944 (3).png" alt="Shake & Smile" class="w-32 h-32 rounded-full logo-box mx-auto mb-4 object-cover">
            <div class="absolute inset-0 rounded-full border border-[#D4AF37] animate-ping opacity-20"></div>
        </div>
        <h1 class="text-3xl font-black tracking-tighter gold-text uppercase mt-2">SHAKE & SMILE</h1>
        <div class="h-1 w-16 bg-[#D4AF37] mx-auto mt-2 rounded-full"></div>
    </header>

    <div class="grid grid-cols-1 gap-4 mb-10 animate__animated animate__fadeInUp">
        <a href="https://wa.me/243978355121" class="btn-gold flex items-center justify-center py-4 text-sm uppercase tracking-widest pulse-gold">
            <i class="fa-brands fa-whatsapp text-xl mr-2"></i> Réserver sur WhatsApp
        </a>
        <div class="grid grid-cols-2 gap-3">
            <a href="https://www.instagram.com/shake.andsmile?utm_source=qr&igsh=MThycWEzbjZ4MGx5NA==" class="bg-zinc-900/50 rounded-xl flex items-center justify-center py-4 text-xs font-bold uppercase border border-zinc-800">
                <i class="fa-brands fa-instagram text-[#D4AF37] mr-2"></i> Instagram
            </a>
            <a href="https://tiktok.com/@shakeandsmilecocktail" class="bg-zinc-900/50 rounded-xl flex items-center justify-center py-4 text-xs font-bold uppercase border border-zinc-800">
                <i class="fa-brands fa-tiktok text-[#D4AF37] mr-2"></i> TikTok
            </a>
        </div>
    </div>

    <div class="app-card p-6 shadow-2xl animate__animated animate__fadeInUp animate__delay-1s">
        <h2 class="text-center text-[10px] font-black mb-6 tracking-[0.3em] uppercase text-gray-400">Règlement des prestations</h2>
        
        <button id="pay-start" onclick="this.classList.add('hidden'); document.getElementById('pay-grid').classList.remove('hidden');" class="w-full py-4 rounded-xl border border-[#D4AF37] text-[#D4AF37] text-[10px] font-black uppercase tracking-[0.2em]">
            Effectuer un paiement
        </button>

        <div id="pay-grid" class="hidden animate__animated animate__fadeIn">
            <div class="flex justify-around items-center gap-6">
                <div onclick="selectPay('O')" class="text-center cursor-pointer group">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Orange_logo.svg" class="w-16 h-16 rounded-2xl shadow-lg mb-2 mx-auto group-active:scale-90 transition">
                    <p class="text-[9px] font-bold text-orange-500">ORANGE</p>
                </div>
                <div onclick="selectPay('A')" class="text-center cursor-pointer group">
                    <div class="w-16 h-16 bg-white rounded-2xl shadow-lg mb-2 mx-auto flex items-center justify-center p-2 group-active:scale-90 transition">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Airtel_logo_new.svg" class="w-full h-auto">
                    </div>
                    <p class="text-[9px] font-bold text-red-600 uppercase text-center">Airtel</p>
                </div>
            </div>

            <div id="pay-details" class="hidden mt-8 p-6 bg-black/60 rounded-3xl border border-[#D4AF37]/30 text-center animate__animated animate__zoomIn">
                <p id="pay-name" class="text-[10px] font-black mb-3 tracking-widest uppercase"></p>
                <p id="pay-num" class="text-xl font-mono font-bold gold-text mb-2 tracking-tighter"></p>
                <div class="h-[1px] w-10 bg-zinc-800 mx-auto mb-3"></div>
                <p class="text-[9px] text-gray-500 mb-1">TITULAIRE DU COMPTE</p>
                <p class="text-xs font-bold text-white uppercase mb-6">Corneille Nday</p>
                <a href="https://wa.me/243978355121?text=Confirmation_Paiement" class="text-[9px] font-bold text-blue-400 border-b border-blue-400 pb-1 uppercase tracking-widest">Confirmer l'envoi</a>
            </div>
        </div>
    </div>

    <footer class="mt-16 text-center opacity-50">
        <p class="text-[8px] text-gray-500 uppercase tracking-[0.5em]">© 2026 Shake & Smile • Excellence</p>
    </footer>

    <script>
        function selectPay(op) {
            const box = document.getElementById('pay-details');
            const title = document.getElementById('pay-name');
            const num = document.getElementById('pay-num');
            box.classList.remove('hidden');
            if(op === 'O') {
                title.innerText = "Orange Money RDC";
                title.style.color = "#ff7900";
                num.innerText = "084 061 284 9";
            } else {
                title.innerText = "Airtel Money RDC";
                title.style.color = "#e11d48";
                num.innerText = "097 835 512 1";
            }
            box.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
